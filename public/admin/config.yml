backend:
  name: github
  repo: scouting-sint-sebastiaan/scouting-sint-sebastiaan.github.io
  branch: main
  # Inloggen met GitHub loopt via /auth en /callback (Cloudflare Pages Functions, map functions/)
  base_url: https://scouting-sint-sebastiaan.pages.dev
  auth_methods: [oauth]

site_url: https://www.scoutingsintsebastiaan.nl
display_url: https://www.scoutingsintsebastiaan.nl
logo:
  src: /uploads/logo-basje.png

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: melding
    label: Melding bovenaan de site
    files:
      - name: melding
        label: Melding
        file: src/data/melding.json
        preview_path: /
        fields:
          - { name: aan, label: Melding tonen, widget: boolean, default: false }
          - { name: tekst, label: Tekst (bijvoorbeeld "Opkomst zaterdag gaat niet door vanwege storm"), widget: string, required: false }
          - { name: link, label: Link voor meer informatie (optioneel), widget: string, required: false }
          - { name: tot, label: Tonen tot en met (optioneel; daarna verdwijnt de melding vanzelf), widget: datetime, time_format: false, date_format: "DD-MM-YYYY", format: "YYYY-MM-DD", required: false }

  - name: nieuws
    label: Nieuws
    label_singular: Nieuwsbericht
    folder: src/content/nieuws
    preview_path: nieuws/{{slug}}/
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date}} - {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: date, label: Datum, widget: datetime, time_format: false, date_format: "DD-MM-YYYY", format: "YYYY-MM-DD" }
      - { name: samenvatting, label: Korte samenvatting (voor het overzicht), widget: text, required: false }
      - { name: image, label: Foto, widget: image, required: false }
      - { name: body, label: Tekst, widget: markdown }

  - name: agenda
    label: Agenda
    label_singular: Activiteit
    folder: src/content/agenda
    preview_path: agenda/
    create: true
    summary: "{{date}} - {{title}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Naam van de activiteit, widget: string }
      - { name: date, label: Datum, widget: datetime, time_format: false, date_format: "DD-MM-YYYY", format: "YYYY-MM-DD" }
      - { name: tijd, label: Tijd (bijvoorbeeld 14:00 - 17:00), widget: string, required: false }
      - { name: locatie, label: Locatie, widget: string, required: false }
      - name: speltakken
        label: Speltakken (leeg laten als het voor de hele groep is)
        widget: relation
        collection: speltakken
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
      - { name: wie, label: "Voor wie (optioneel extra tekst, bijvoorbeeld Ouders)", widget: string, required: false }
      - { name: body, label: Meer informatie, widget: markdown, required: false }

  - name: speltakken
    label: Speltakken
    label_singular: Speltak
    folder: src/content/speltakken
    preview_path: groepen/{{slug}}/
    create: false
    delete: false
    fields:
      - { name: title, label: Naam, widget: string }
      - { name: order, label: Volgorde in het menu, widget: number, value_type: int, default: 1 }
      - { name: leeftijd, label: Leeftijd, widget: string }
      - { name: draaitijd, label: Wanneer (dag en tijd), widget: string, required: false }
      - { name: staf, label: Leiding, widget: text, required: false }
      - { name: email, label: E-mailadres van de speltak, widget: string, required: false }
      - { name: image, label: Foto, widget: image, required: false }
      - { name: body, label: Tekst, widget: markdown }

  - name: paginas
    label: Pagina's
    label_singular: Pagina
    folder: src/content/paginas
    preview_path: "{{slug}}/"
    create: true
    fields:
      - { name: title, label: Titel, widget: string }
      - name: menu
        label: In welk menu moet de pagina komen?
        widget: select
        default: geen
        options:
          - { label: Ontdek onze scouting, value: ontdek }
          - { label: Lid worden, value: lid-worden }
          - { label: Niet in het menu, value: geen }
      - { name: order, label: Volgorde in het menu (klein getal eerst), widget: number, value_type: int, default: 10 }
      - { name: body, label: Tekst, widget: markdown }

  - name: speciaal
    label: Contact, contributie en home
    files:
      - name: home
        label: Startpagina (tekst)
        file: src/content/speciaal/home.md
        preview_path: /
        fields:
          - { name: title, label: Titel, widget: hidden, default: Welkom bij Scouting St. Sebastiaan }
          - { name: menu, label: Menu, widget: hidden, default: geen }
          - { name: order, label: Volgorde, widget: hidden, default: 0 }
          - name: fotos
            label: Foto's op de startpagina
            widget: object
            collapsed: true
            required: false
            hint: Laat een veld leeg om de standaardfoto te gebruiken. Liggende foto's werken het best.
            fields:
              - { name: banner, label: Grote foto bovenaan, widget: image, required: false }
              - { name: kolom1, label: Foto bij de eerste kolom, widget: image, required: false }
              - { name: kolom2, label: Foto bij de tweede kolom, widget: image, required: false }
              - { name: snel, label: Foto bij "Snel naar", widget: image, required: false }
              - { name: oproep, label: Afbeelding bij "Vrijwilligers gezocht" (bij voorkeur zonder achtergrond), widget: image, required: false }
              - { name: groepen, label: Foto bij "Onze groepen", widget: image, required: false }
              - { name: nieuws, label: Foto voor nieuwsberichten zonder eigen foto, widget: image, required: false }
          - { name: body, label: Tekst, widget: markdown }
      - name: contact
        label: Contact
        file: src/content/speciaal/contact.md
        preview_path: contact/
        fields:
          - { name: title, label: Titel, widget: hidden, default: Contact }
          - { name: menu, label: Menu, widget: hidden, default: geen }
          - { name: order, label: Volgorde, widget: hidden, default: 0 }
          - { name: adres, label: Adres, widget: string, required: false }
          - name: bestuur
            label: Bestuursleden
            widget: list
            required: false
            summary: "{{fields.functie}}: {{fields.naam}}"
            fields:
              - { name: functie, label: Functie, widget: string }
              - { name: naam, label: Naam, widget: string }
              - { name: email, label: E-mailadres, widget: string, required: false }
              - { name: telefoon, label: Telefoon, widget: string, required: false }
          - name: overig
            label: Overige contactpersonen
            widget: list
            required: false
            summary: "{{fields.functie}}: {{fields.naam}}"
            fields:
              - { name: functie, label: Functie, widget: string }
              - { name: naam, label: Naam, widget: string }
              - { name: email, label: E-mailadres, widget: string, required: false }
              - { name: telefoon, label: Telefoon, widget: string, required: false }
          - { name: body, label: Tekst, widget: markdown }
      - name: contributie
        label: Contributie
        file: src/content/speciaal/contributie.md
        preview_path: contributie/
        fields:
          - { name: title, label: Titel, widget: hidden, default: Contributie }
          - { name: menu, label: Menu, widget: hidden, default: lid-worden }
          - { name: order, label: Volgorde, widget: hidden, default: 2 }
          - name: tarieven
            label: Bedragen per kwartaal
            widget: list
            summary: "{{fields.speltak}}: {{fields.bedrag}}"
            fields:
              - { name: speltak, label: Speltak, widget: string }
              - { name: bedrag, label: "Bedrag (bijvoorbeeld 30,-)", widget: string }
          - { name: iban, label: IBAN, widget: string }
          - { name: tenaamstelling, label: Ten name van, widget: string }
          - { name: body, label: Tekst, widget: markdown }

  - name: algemeen
    label: Algemene instellingen
    files:
      - name: algemeen
        label: Footer, links en startpagina
        file: src/data/algemeen.json
        preview_path: /
        fields:
          - { name: adres, label: Adres, widget: string, required: false }
          - { name: email, label: Algemeen e-mailadres, widget: string, hint: "Hier komen ook de berichten 'Algemene vraag' van het contactformulier binnen.", pattern: ['^[^@ ]+@[^@ ]+\.[^@ ]+$', 'Vul een geldig e-mailadres in'] }
          - { name: facebook, label: Facebook-pagina, widget: string, required: false, pattern: ['^https://', 'Begin met https://'] }
          - { name: instagram, label: Instagram-pagina, widget: string, required: false, pattern: ['^https://', 'Begin met https://'] }
          - name: voetLinks
            label: Links onderaan elke pagina
            label_singular: link
            widget: list
            required: false
            summary: "{{fields.tekst}}"
            fields:
              - { name: tekst, label: Tekst, widget: string }
              - { name: link, label: Link, widget: string, hint: "Binnen de site begint een link met /, bijvoorbeeld /contact/. Een andere website begint met https://", pattern: ['^(/|https?://)', 'Begin met / of https://'] }
          - name: snelNaar
            label: Links bij "Snel naar" op de startpagina
            label_singular: link
            widget: list
            required: false
            summary: "{{fields.tekst}}"
            fields:
              - { name: tekst, label: Tekst, widget: string }
              - { name: link, label: Link, widget: string, hint: "Binnen de site begint een link met /, bijvoorbeeld /contact/. Een andere website begint met https://", pattern: ['^(/|https?://)', 'Begin met / of https://'] }
          - name: kolomKnoppen
            label: Knoppen onder de kolommen op de startpagina
            widget: object
            fields:
              - name: kolom1
                label: Eerste kolom
                widget: object
                fields:
                  - { name: tekst, label: Tekst op de knop, widget: string }
                  - { name: link, label: Link, widget: string, hint: "Binnen de site begint een link met /, bijvoorbeeld /contact/. Een andere website begint met https://", pattern: ['^(/|https?://)', 'Begin met / of https://'] }
              - name: kolom2
                label: Tweede kolom
                widget: object
                fields:
                  - { name: tekst, label: Tekst op de knop, widget: string }
                  - { name: link, label: Link, widget: string, hint: "Binnen de site begint een link met /, bijvoorbeeld /contact/. Een andere website begint met https://", pattern: ['^(/|https?://)', 'Begin met / of https://'] }
          - name: oproep
            label: Groen blok "Vrijwilligers gezocht" op de startpagina
            widget: object
            fields:
              - { name: titel, label: Titel, widget: string }
              - { name: tekst, label: Tekst, widget: text }
              - { name: knop, label: Tekst op de knop, widget: string }
              - { name: link, label: Link, widget: string, hint: "Binnen de site begint een link met /, bijvoorbeeld /contact/. Een andere website begint met https://", pattern: ['^(/|https?://)', 'Begin met / of https://'] }

  - name: geavanceerd
    label: "⚠️ Geavanceerd (HTML)"
    description: "Alleen voor wie HTML kent. Lees de uitleg bovenaan voordat je iets aanpast."
    files:
      - name: geavanceerd
        label: "Eigen HTML"
        file: src/data/geavanceerd.json
        preview_path: /
        fields:
          - name: bevestiging
            label: "Typ ter bevestiging: OK"
            widget: string
            hint: "Hiermee verander je hoe de site eruitziet en werkt. Lees eerst even de uitleg hieronder."
            pattern: ['^[Oo][Kk]$', 'Typ OK om te bevestigen']
          - name: uitleg
            label: Uitleg
            widget: string
            required: false
            preview: false
            hint: >-
              **Wat gebeurt er na het opslaan?**
              Na ongeveer een minuut staat je HTML op de site. Controleer het resultaat even op de live site.<br><br>
              **Zie je je wijziging niet online?**
              Dan is je HTML waarschijnlijk geweigerd. Dat gebeurt als de HTML fouten bevat, bijvoorbeeld een tag die niet goed wordt afgesloten. Dat blok toont dan de normale versie, ook als er eerst andere eigen HTML stond. De rest van de site werkt gewoon door. Binnen een paar minuten komt er een mail in tech@scoutingsintsebastiaan.nl met wat er mis is. Herstel de HTML en klik opnieuw op Opslaan.<br><br>
              **Ziet het er niet goed uit?**
              De controle kijkt alleen of de HTML klopt, niet hoe het eruitziet. Dit krijg je dus niet per mail door. Maak het veld leeg en klik op Opslaan. Na ongeveer een minuut is de normale versie terug.
          - { name: footer, label: "Footer: eigen HTML (leeg = de normale footer)", hint: "Vervangt de hele inhoud van de footer, op elke pagina.", widget: code, default_language: html, allow_language_selection: false, output_code_only: true, required: false }
          - { name: snelNaar, label: "Snel naar: eigen HTML (leeg = de normale links)", hint: "Vervangt de lijst met links op de startpagina.", widget: code, default_language: html, allow_language_selection: false, output_code_only: true, required: false }
          - { name: oproep, label: "Vrijwilligers gezocht: eigen HTML (leeg = het normale blok)", hint: "Vervangt de titel, tekst en knop op de startpagina. De afbeelding blijft staan.", widget: code, default_language: html, allow_language_selection: false, output_code_only: true, required: false }

  - name: instellingen
    label: Website openbaar maken
    files:
      - name: livegang
        label: Livegang
        file: src/data/livegang.json
        fields:
          - name: live
            label: Website openbaar op www.scoutingsintsebastiaan.nl
            widget: boolean
            default: false
            hint: "Uit: www.scoutingsintsebastiaan.nl toont een tijdelijke pagina. Aan: de hele website is daar te zien en vindbaar in zoekmachines. Na opslaan duurt het ongeveer een minuut."
